<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumas Butik · Personel Paneli</title>
<style>
  :root {
    --bg: #0f172a; --bg-soft: #1e293b; --panel: #131c31; --panel-2: #182238;
    --border: #27324a; --text: #e2e8f0; --muted: #94a3b8; --muted-2: #64748b;
    --accent: #38bdf8; --accent-2: #a78bfa; --green: #4ade80; --amber: #fbbf24; --red: #f87171;
    --grad: linear-gradient(90deg, #38bdf8, #a78bfa); --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: radial-gradient(circle at 50% -10%, #1e293b, #0f172a); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font-family: inherit; }
  .hidden { display: none !important; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: min(92vw, 390px); background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 34px 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); text-align: center; }
  .brand { font-size: 1.7rem; font-weight: 800; letter-spacing: 2px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; letter-spacing: 3px; text-transform: uppercase; }
  .login-card h2 { font-size: 1.1rem; margin: 26px 0 18px; font-weight: 600; }
  .field { text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .input { width: 100%; padding: 12px 14px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
  textarea.input { resize: vertical; min-height: 84px; }
  select.input { appearance: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; font-size: 0.95rem; font-weight: 700; color: #0f172a; background: var(--grad); border: none; border-radius: 999px; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s, opacity 0.15s; box-shadow: 0 6px 20px rgba(56,189,248,0.3); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(56,189,248,0.45); }
  .btn:active { transform: translateY(0); }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--accent); box-shadow: none; }
  .btn.danger { background: linear-gradient(90deg,#fb7185,#f87171); color: #450a0a; box-shadow: 0 6px 20px rgba(248,113,113,0.3); }
  .btn.sm { padding: 7px 13px; font-size: 0.82rem; }
  .login-err { color: var(--red); font-size: 0.85rem; min-height: 20px; margin-bottom: 8px; }
  .login-hint { color: var(--muted-2); font-size: 0.78rem; margin-top: 16px; }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .sidebar .brand { font-size: 1.35rem; }
  .sidebar .brand-sub { margin-bottom: 8px; }
  .who { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .who .nm { font-weight: 700; font-size: 0.92rem; }
  .who .rl { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .nav-item .ic { width: 20px; text-align: center; font-size: 1.05rem; }
  .nav-item:hover { background: var(--panel-2); color: var(--text); }
  .nav-item.active { background: var(--panel-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  .nav-spacer { flex: 1; }
  .logout { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; }
  .logout:hover { background: var(--panel-2); color: var(--red); }

  .main { padding: 26px 30px 60px; overflow-x: hidden; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; gap: 16px; flex-wrap: wrap; }
  .topbar h1 { font-size: 1.5rem; font-weight: 700; }
  .topbar .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .stat .label { color: var(--muted); font-size: 0.82rem; display: flex; align-items: center; gap: 8px; }
  .stat .value { font-size: 1.9rem; font-weight: 800; margin-top: 8px; }
  .stat .value.accent { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 22px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 180px; position: relative; }
  .search input { padding-left: 38px; }
  .search .si { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }
  .select { max-width: 200px; }

  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 620px; }
  th, td { text-align: left; padding: 13px 16px; font-size: 0.9rem; }
  thead th { background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  tbody tr { border-top: 1px solid var(--border); transition: background 0.12s; }
  tbody tr:hover { background: var(--panel-2); }
  td .thumb { width: 42px; height: 42px; border-radius: 8px; background: var(--bg-soft); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .prod-cell { display: flex; align-items: center; gap: 12px; }
  .prod-cell .pn { font-weight: 600; }
  .prod-cell .pc { color: var(--muted-2); font-size: 0.78rem; }
  .price { font-weight: 700; }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; transition: color 0.12s, border-color 0.12s; }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn.del:hover { color: var(--red); border-color: var(--red); }

  .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; display: inline-block; white-space: nowrap; }
  .badge.ok { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.low { background: rgba(251,191,36,0.15); color: var(--amber); }
  .badge.out { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge.cat { background: rgba(167,139,250,0.15); color: var(--accent-2); }
  .badge.g-kadin { background: rgba(244,114,182,0.15); color: #f472b6; }
  .badge.g-erkek { background: rgba(56,189,248,0.15); color: var(--accent); }
  .badge.hazirlaniyor { background: rgba(251,191,36,0.15); color: var(--amber); }
  .badge.kargoda { background: rgba(56,189,248,0.15); color: var(--accent); }
  .badge.teslim { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.iptal { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge.role { background: rgba(167,139,250,0.15); color: var(--accent-2); }

  .empty { text-align: center; padding: 46px 20px; color: var(--muted-2); }
  .empty .big { font-size: 2.4rem; margin-bottom: 10px; }

  .modal-back { position: fixed; inset: 0; background: rgba(8,12,22,0.72); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { width: min(94vw, 540px); max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
  .modal h3 { font-size: 1.2rem; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .seg { display: flex; gap: 6px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 8px; }
  .seg button { flex: 1; border: none; background: none; color: var(--muted); padding: 8px; border-radius: 7px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  .hint-txt { font-size: 0.78rem; color: var(--muted-2); margin-top: 6px; }
  .img-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .img-thumb { position: relative; width: 74px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-soft); }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .img-thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(15,23,42,0.85); color: #fff; font-size: 0.9rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .img-thumb .cover { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase; background: linear-gradient(0deg, rgba(56,189,248,0.9), rgba(56,189,248,0)); color: #05263a; font-weight: 700; padding: 6px 0 2px; }
  td .thumb { overflow: hidden; }
  td .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .toast-wrap { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 80; }
  .toast { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--green); padding: 12px 18px; border-radius: 10px; font-size: 0.9rem; box-shadow: 0 12px 30px rgba(0,0,0,0.4); animation: toastIn 0.25s ease-out; }
  .toast.err { border-left-color: var(--red); }
  @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .menu-toggle { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 40; width: 240px; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.22s ease; }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: inline-flex; }
    .form-grid { grid-template-columns: 1fr; }
    .main { padding: 18px 16px 60px; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="brand">LUMAS</div>
    <div class="brand-sub">Butik · Personel</div>
    <h2>Personel Girişi</h2>
    <div class="field">
      <label for="lu_user">Kullanıcı Adı</label>
      <input class="input" id="lu_user" placeholder="kullanıcı adı" autocomplete="username">
    </div>
    <div class="field">
      <label for="lu_pw">Parola</label>
      <input class="input" type="password" id="lu_pw" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn full" id="loginBtn">Giriş Yap</button>
    <div class="login-hint">Yetkiniz yoksa yöneticinizden kullanıcı oluşturmasını isteyin.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="appView">
  <aside class="sidebar" id="sidebar">
    <div class="brand">LUMAS</div>
    <div class="brand-sub">Butik · Personel</div>
    <div class="who"><div class="nm" id="whoName">—</div><div class="rl" id="whoRole">—</div></div>
    <div id="navItems"></div>
    <div class="nav-spacer"></div>
    <div class="logout" id="logoutBtn"><span class="ic">🚪</span> Çıkış Yap</div>
  </aside>
  <div class="scrim hidden" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
        <div><h1 id="pageTitle">Panel</h1><div class="sub" id="pageSub">Genel bakış</div></div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div id="pageContent"></div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function () {
  "use strict";

  const DB_KEY = 'lumas_admin_db_v2';
  const SESSION_KEY = 'lumas_staff_session';

  const STATUS = {
    hazirlaniyor: 'Sipariş hazırlanıyor',
    kargoda: 'Siparişiniz kargoya teslim edildi',
    teslim: 'Siparişiniz teslim edildi',
    iptal: 'Siparişiniz iptal edildi'
  };
  const STATUS_ORDER = ['hazirlaniyor', 'kargoda', 'teslim', 'iptal'];

  const ROLES = {
    owner: 'Sahip (Tam Yetki)',
    yonetici: 'Yönetici',
    personel: 'Personel'
  };
  // Sayfa erişimleri
  const ACCESS = {
    dashboard: ['owner', 'yonetici', 'personel'],
    products: ['owner', 'yonetici'],
    orders: ['owner', 'yonetici', 'personel'],
    categories: ['owner', 'yonetici'],
    settings: ['owner', 'yonetici'],
    users: ['owner']
  };
  const NAV = [
    { id: 'dashboard', icon: '📊', label: 'Panel', sub: 'Genel bakış' },
    { id: 'products', icon: '👗', label: 'Ürünler', sub: 'Ürün kataloğunu yönet' },
    { id: 'orders', icon: '🛍️', label: 'Siparişler', sub: 'Siparişleri takip et' },
    { id: 'categories', icon: '🏷️', label: 'Kategoriler', sub: 'Kategorileri düzenle' },
    { id: 'settings', icon: '⚙️', label: 'Ayarlar', sub: 'Mağaza ayarları' },
    { id: 'users', icon: '👥', label: 'Kullanıcılar', sub: 'Personel ve yetkiler' }
  ];

  const seed = {
    settings: { storeName: 'Lumas Butik', currency: '₺', lowStock: 5, workStart: 9, workEnd: 17 },
    staff: [{ id: 'u_owner', username: 'MeteTombul', password: '05052005', role: 'owner', name: 'Mete Tombul' }],
    categories: [
      { id: 'c1', name: 'Elbise' }, { id: 'c2', name: 'Üst Giyim' },
      { id: 'c3', name: 'Alt Giyim' }, { id: 'c4', name: 'Aksesuar' }
    ],
    products: [
      { id: 'p1', name: 'Saten Midi Elbise', gender: 'kadin', category: 'c1', price: 899, stock: 12, sku: 'LMS-K-EL-001', desc: 'Zarif saten dokusuyla öne çıkan midi elbise; gündüz şıklığından özel davetlere kadar her anınıza eşlik eder.' },
      { id: 'p2', name: 'Oversize Triko Kazak', gender: 'kadin', category: 'c2', price: 549, stock: 6, sku: 'LMS-K-UG-014', desc: 'Yumuşacık örgü dokulu, rahat oversize kalıp. Sonbahar kombinlerinizin zarif tamamlayıcısı.' },
      { id: 'p3', name: 'Yüksek Bel Palazzo Pantolon', gender: 'kadin', category: 'c3', price: 649, stock: 8, sku: 'LMS-K-AG-022', desc: 'Dökümlü kumaşı ve yüksek beliyle zarif bir duruş sunan, gün boyu rahat palazzo pantolon.' },
      { id: 'p4', name: 'Altın Kaplama Kolye', gender: 'kadin', category: 'c4', price: 299, stock: 20, sku: 'LMS-K-AK-003', desc: 'İnce işçilikli, altın kaplama minimal kolye; günlük şıklığınıza zarif bir dokunuş katar.' },
      { id: 'p5', name: 'Slim Fit Gömlek', gender: 'erkek', category: 'c2', price: 499, stock: 15, sku: 'LMS-E-UG-101', desc: 'Modern slim fit kalıp ve nefes alan kumaş. Ofisten davete kadar rahatça taşıyabileceğiniz zamansız bir parça.' },
      { id: 'p6', name: 'Keten Pantolon', gender: 'erkek', category: 'c3', price: 599, stock: 10, sku: 'LMS-E-AG-108', desc: 'Serin tutan keten kumaşı ve rahat kesimiyle yazlık kombinlerin şık ve konforlu tamamlayıcısı.' },
      { id: 'p7', name: 'Bomber Mont', gender: 'erkek', category: 'c2', price: 1249, stock: 5, sku: 'LMS-E-UG-115', desc: 'Dinç ve modern duruşuyla bomber mont; günlük stilinize güçlü bir hava katar.' },
      { id: 'p8', name: 'Hakiki Deri Kemer', gender: 'erkek', category: 'c4', price: 349, stock: 18, sku: 'LMS-E-AK-104', desc: 'Hakiki deriden üretilen, dayanıklı ve şık kemer; her kombini özenle tamamlar.' }
    ],
    orders: [],
    customers: []
  };

  function load() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) { save(structuredClone(seed)); return load(); }
      return Object.assign(structuredClone(seed), JSON.parse(raw));
    } catch (e) { return structuredClone(seed); }
  }
  function save(d) {
    try { localStorage.setItem(DB_KEY, JSON.stringify(d || db)); return true; }
    catch (e) { toast('Kaydedilemedi: depolama alanı dolmuş olabilir. Daha az/küçük fotoğraf deneyin.', true); return false; }
  }

  /* Fotoğrafı tarayıcıda küçültüp JPEG data-URL'e çevir (kota dostu) */
  function fileToResizedDataURL(file, maxDim, quality) {
    maxDim = maxDim || 800; quality = quality || 0.8;
    return new Promise((resolve, reject) => {
      if (!file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not image')); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject; img.src = e.target.result;
      };
      reader.onerror = reject; reader.readAsDataURL(file);
    });
  }
  let db = load();
  let me = null; // current logged-in staff

  const uid = (p) => p + Date.now().toString(36) + Math.floor(performance.now() % 1000).toString(36);
  const money = (n) => (db.settings.currency || '₺') + Number(n || 0).toLocaleString('tr-TR');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const catName = (id) => (db.categories.find(c => c.id === id) || {}).name || '—';
  const can = (page) => me && ACCESS[page] && ACCESS[page].includes(me.role);

  function toast(msg, err) {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg;
    document.getElementById('toastWrap').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2400);
    setTimeout(() => el.remove(), 2800);
  }

  /* ---------------- Auth ---------------- */
  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const luUser = document.getElementById('lu_user');
  const luPw = document.getElementById('lu_pw');
  const loginErr = document.getElementById('loginErr');

  function doLogin() {
    db = load();
    const u = luUser.value.trim();
    const p = luPw.value;
    const found = (db.staff || []).find(s => s.username.toLowerCase() === u.toLowerCase() && s.password === p);
    if (!found) { loginErr.textContent = 'Kullanıcı adı veya parola hatalı.'; luPw.value = ''; return; }
    me = found;
    sessionStorage.setItem(SESSION_KEY, found.id);
    loginErr.textContent = ''; luUser.value = ''; luPw.value = '';
    showApp();
  }
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  luPw.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  luUser.addEventListener('keydown', e => { if (e.key === 'Enter') luPw.focus(); });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY); me = null;
    appView.classList.add('hidden'); loginView.classList.remove('hidden'); luUser.focus();
  });

  function showApp() {
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    document.getElementById('whoName').textContent = me.name || me.username;

  /* ---------------- Navigation ---------------- */
  const pages = {};
  let current = 'dashboard';
  function buildNav() {
    const wrap = document.getElementById('navItems');
    wrap.innerHTML = NAV.filter(n => can(n.id)).map(n =>
      `<div class="nav-item" data-page="${n.id}"><span class="ic">${n.icon}</span> ${n.label}</div>`).join('');
    wrap.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => navigate(n.dataset.page)));
  }
  function navigate(page) {
    if (!can(page)) page = 'dashboard';
    current = page;
    const meta = NAV.find(n => n.id === page);
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
    document.getElementById('pageTitle').textContent = meta.label;
    document.getElementById('pageSub').textContent = meta.sub;
    document.getElementById('topbarActions').innerHTML = '';
    document.getElementById('pageContent').innerHTML = '';
    pages[page]();
    closeSidebar();
  }
  const sidebar = document.getElementById('sidebar'), scrim = document.getElementById('scrim');
  function openSidebar() { sidebar.classList.add('open'); scrim.classList.remove('hidden'); }
  function closeSidebar() { sidebar.classList.remove('open'); scrim.classList.add('hidden'); }
  document.getElementById('menuToggle').addEventListener('click', openSidebar);
  scrim.addEventListener('click', closeSidebar);

  /* ---------------- helpers ---------------- */
  function statusBadge(s) { return `<span class="badge ${s}">${esc(STATUS[s] || s)}</span>`; }
  function stockBadge(n) {
    n = Number(n);
    if (n === 0) return '<span class="badge out">Tükendi</span>';
    if (n <= db.settings.lowStock) return `<span class="badge low">Az (${n})</span>`;
    return `<span class="badge ok">${n} adet</span>`;
  }
  function genderBadge(g) { return g === 'erkek' ? '<span class="badge g-erkek">Erkek</span>' : '<span class="badge g-kadin">Kadın</span>'; }
  function emptyBox(icon, text) { return `<div class="empty"><div class="big">${icon}</div>${esc(text)}</div>`; }

  pages.dashboard = function () {

  /* ---------------- OTOMATIK AÇIKLAMA ---------------- */
  function autoDesc(name, cat, gender) {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const data = {
      kadin: {
        intro: ['Zarif duruşuyla', 'Feminen çizgisiyle', 'Modern kesimiyle', 'Zamansız tasarımıyla', 'Şıklığı ön plana çıkaran'],
        mid: ['gardırobunuzun favori parçası olmaya aday', 'gün boyu konfor sunan', 'özel anlarınıza eşlik eden', 'her kombini tamamlayan'],
        end: ['Özenle seçilmiş kumaşıyla fark yaratır.', 'Zarafeti ve rahatlığı bir arada sunar.', 'Her dolapta yeri olması gereken bir seçim.']
      },
      erkek: {
        intro: ['Modern ve dinç duruşuyla', 'Sade ama etkileyici tasarımıyla', 'Rahat kesimiyle', 'Kaliteli kumaşıyla', 'Güçlü çizgisiyle'],
        mid: ['günlük stilinizi tamamlayan', 'ofisten sosyal hayata uzanan', 'gün boyu konfor sağlayan', 'her kombine uyum sağlayan'],
        end: ['Özenle seçilmiş detaylarıyla öne çıkar.', 'Şıklığı ve konforu bir araya getirir.', 'Her gardıropta yer bulması gereken bir parça.']
      }
    };
    const d = data[gender] || data.kadin;
    const catLow = (cat || 'parça').toLocaleLowerCase('tr');
    return `${pick(d.intro)} öne çıkan bu ${catLow}, ${pick(d.mid)} bir seçim. ${pick(d.end)}`;
  }

  function renderProducts() {
    const q = prodFilter.q.trim().toLowerCase();
    let list = db.products.filter(p =>
      (!prodFilter.gender || p.gender === prodFilter.gender) &&
      (!prodFilter.cat || p.category === prodFilter.cat) &&
      (!q || p.name.toLowerCase().includes(q) || (p.sku || '').toLowerCase().includes(q)));

        <tbody>${list.map(p => `
          <tr>
            <td><div class="prod-cell"><div class="thumb">${p.images && p.images[0] ? `<img src="${p.images[0]}" alt="">` : (p.gender === 'erkek' ? '👔' : '👗')}</div><div><div class="pn">${esc(p.name)}</div><div class="pc">${esc(p.sku || '')}</div></div></div></td>

          </tr>`).join('')}</tbody>
      </table></div>`;
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => productModal(b.dataset.edit)));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {

  function productModal(id) {
    const p = id ? db.products.find(x => x.id === id)
      : { name: '', gender: 'kadin', category: db.categories[0] && db.categories[0].id, price: '', stock: '', sku: '', desc: '', images: [] };
    openModal(`${id ? 'Ürünü Düzenle' : 'Yeni Ürün'}`, `
      <div class="form-grid">
        <div class="field full"><label>Ürün adı</label><input class="input" id="f_name" value="${esc(p.name)}" placeholder="Ör. Saten Midi Elbise"></div>
        <div class="field"><label>Cinsiyet bölümü</label>
          <select class="input" id="f_gender"><option value="kadin" ${p.gender === 'kadin' ? 'selected' : ''}>Kadın</option><option value="erkek" ${p.gender === 'erkek' ? 'selected' : ''}>Erkek</option></select>
        </div>
        <div class="field"><label>Kategori</label>
          <select class="input" id="f_cat">${db.categories.map(c => `<option value="${c.id}" ${c.id === p.category ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>

          <button type="button" class="btn ghost sm" id="addImgBtn">📷 Fotoğraf Ekle</button>
          <div class="hint-txt">Birden fazla ekleyebilirsin; ilki kapak olur. Fotoğraflar müşteri sayfasında otomatik ortalanıp yerleştirilir.</div>
        </div>
        <div class="field full">
          <label>Açıklama</label>
          <div class="seg" id="descSeg">

          </div>
          <textarea class="input" id="f_desc" placeholder="Ürün açıklaması...">${esc(p.desc)}</textarea>
          <div class="hint-txt" id="descHint">Cinsiyet ve kategoriye göre otomatik, yayına hazır bir açıklama üretebilir; sonra düzenleyebilirsin.</div>
        </div>
      </div>`,
      () => {
        const name = document.getElementById('f_name').value.trim();
        if (!name) { toast('Ürün adı zorunlu', true); return false; }
        const data = {
          name, gender: document.getElementById('f_gender').value,
          category: document.getElementById('f_cat').value,
          sku: document.getElementById('f_sku').value.trim(),
          price: Number(document.getElementById('f_price').value) || 0,
          stock: Number(document.getElementById('f_stock').value) || 0,
          desc: document.getElementById('f_desc').value.trim(),
          images: imgs.slice()
        };
        if (id) { Object.assign(p, data); toast('Ürün güncellendi'); }
        else { db.products.push(Object.assign({ id: uid('p') }, data)); toast('Ürün eklendi'); }
        save(); renderProducts(); return true;
      });
    // fotoğraf yönetimi
    let imgs = (p.images || []).slice();
    const imgRow = document.getElementById('imgRow');
    function drawImgs() {
      imgRow.innerHTML = imgs.length
        ? imgs.map((src, i) => `<div class="img-thumb"><img src="${src}" alt=""><button type="button" data-rm="${i}" title="Kaldır">×</button>${i === 0 ? '<span class="cover">Kapak</span>' : ''}</div>`).join('')
        : '<div class="hint-txt" style="margin:0">Henüz fotoğraf eklenmedi.</div>';
      imgRow.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { imgs.splice(Number(b.dataset.rm), 1); drawImgs(); }));
    }
    drawImgs();
    const fileInput = document.getElementById('f_imgs');
    document.getElementById('addImgBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async e => {
      const files = Array.from(e.target.files || []);
      for (const f of files) { try { imgs.push(await fileToResizedDataURL(f)); } catch (_) {} }
      e.target.value = ''; drawImgs();
    });

    // açıklama modu davranışı
    const seg = document.getElementById('descSeg');
    const ta = document.getElementById('f_desc');
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      if (b.dataset.m === 'auto') {
        const nm = document.getElementById('f_name').value.trim() || 'ürün';
        const g = document.getElementById('f_gender').value;
        const cat = catName(document.getElementById('f_cat').value);
        ta.value = autoDesc(nm, cat, g);
        document.getElementById('descHint').textContent = 'Otomatik açıklama oluşturuldu. Tekrar basınca farklı bir metin üretir; dilediğin gibi düzenleyebilirsin.';
      } else {
        document.getElementById('descHint').textContent = 'Açıklamayı kendin yazabilirsin.';
      }
    }));
    setTimeout(() => document.getElementById('f_name').focus(), 50);
  }

      </table></div>`;
    c.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => userModal(b.dataset.edit)));
    c.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      const u = db.staff.find(x => x.id === b.dataset.del);
      confirmModal(`"${u.username}" kullanıcısını silmek istediğine emin misin?`, () => {
        db.staff = db.staff.filter(x => x.id !== b.dataset.del); save(); renderUsers(); toast('Kullanıcı silindi');
      });
    }));
  }
  function userModal(id) {
    const u = id ? db.staff.find(x => x.id === id) : { name: '', username: '', password: '', role: 'personel' };
    openModal(`${id ? 'Kullanıcıyı Düzenle' : 'Yeni Kullanıcı'}`, `
      <div class="form-grid">
        <div class="field full"><label>Ad Soyad</label><input class="input" id="u_name" value="${esc(u.name)}" placeholder="Ör. Ayşe Yılmaz"></div>
        <div class="field"><label>Kullanıcı adı</label><input class="input" id="u_user" value="${esc(u.username)}" placeholder="kullaniciadi"></div>
        <div class="field"><label>Yetki</label>
          <select class="input" id="u_role">
            <option value="yonetici" ${u.role === 'yonetici' ? 'selected' : ''}>Yönetici</option>
            <option value="personel" ${u.role === 'personel' ? 'selected' : ''}>Personel</option>
          </select>
        </div>
        <div class="field full"><label>Parola ${id ? '(değiştirmek istemiyorsan boş bırak)' : ''}</label><input class="input" id="u_pw" type="text" placeholder="${id ? '••••••••' : 'parola belirle'}"></div>
      </div>`,
      () => {
        const name = document.getElementById('u_name').value.trim();
        const username = document.getElementById('u_user').value.trim();
        const role = document.getElementById('u_role').value;
        const pw = document.getElementById('u_pw').value;
        if (!username) { toast('Kullanıcı adı zorunlu', true); return false; }
        if (db.staff.some(x => x.username.toLowerCase() === username.toLowerCase() && x.id !== (id || ''))) { toast('Bu kullanıcı adı zaten var', true); return false; }
        if (!id && !pw) { toast('Parola belirlemelisin', true); return false; }
        if (id) {
          u.name = name; u.username = username; u.role = role; if (pw) u.password = pw;
          toast('Kullanıcı güncellendi');
        } else {
          db.staff.push({ id: uid('u'), name, username, role, password: pw }); toast('Kullanıcı oluşturuldu');
        }
        save(); renderUsers(); return true;
      });
    setTimeout(() => document.getElementById('u_name').focus(), 50);
  }

  /* ---------------- AYARLAR ---------------- */
  pages.settings = function () {
    const c = document.getElementById('pageContent');
    c.innerHTML = `
      <div class="card"><h3>Mağaza Bilgileri</h3>
        <div class="form-grid">
          <div class="field"><label>Mağaza adı</label><input class="input" id="s_store" value="${esc(db.settings.storeName)}"></div>
          <div class="field"><label>Para birimi simgesi</label><input class="input" id="s_cur" value="${esc(db.settings.currency)}" maxlength="3"></div>
          <div class="field"><label>Az stok eşiği</label><input class="input" id="s_low" type="number" min="1" value="${esc(db.settings.lowStock)}"></div>
          <div class="field"><label>Mesai başlangıcı (saat)</label><input class="input" id="s_ws" type="number" min="0" max="23" value="${esc(db.settings.workStart ?? 9)}"></div>
          <div class="field"><label>Mesai bitişi (saat)</label><input class="input" id="s_we" type="number" min="0" max="23" value="${esc(db.settings.workEnd ?? 17)}"></div>
        </div>
        <div class="hint-txt">Mesai saatleri, sitede "aynı gün / ertesi gün kargo" bilgisini belirler.</div>
        <div style="margin-top:16px"><button class="btn" id="saveStore">Kaydet</button></div>
      </div>
      <div class="card"><h3>Kendi Parolam</h3>
        <div class="form-grid">
          <div class="field full"><label>Yeni parola</label><input class="input" id="s_pw" type="password" placeholder="Yeni parolanı gir"></div>
          <div class="field full"><label>Yeni parola (tekrar)</label><input class="input" id="s_pw2" type="password"></div>
        </div>
        <div style="margin-top:16px"><button class="btn" id="savePw">Parolayı Değiştir</button></div>
      </div>
      <div class="card"><h3>Veri Yönetimi</h3>
        <p style="color:var(--muted);font-size:0.88rem;margin-bottom:14px">Verileri yedekle veya baştan başlamak için sıfırla.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn ghost" id="exportBtn">⬇ Yedek Al (JSON)</button>
          ${me.role === 'owner' ? `<button class="btn danger" id="resetBtn">Tüm Verileri Sıfırla</button>` : ''}
        </div>
      </div>`;
    document.getElementById('saveStore').addEventListener('click', () => {
      db.settings.storeName = document.getElementById('s_store').value.trim() || 'Lumas Butik';
      db.settings.currency = document.getElementById('s_cur').value.trim() || '₺';
      db.settings.lowStock = Math.max(1, Number(document.getElementById('s_low').value) || 5);
      db.settings.workStart = Math.min(23, Math.max(0, Number(document.getElementById('s_ws').value) || 9));
      db.settings.workEnd = Math.min(23, Math.max(0, Number(document.getElementById('s_we').value) || 17));
      save(); toast('Ayarlar kaydedildi');
    });
    document.getElementById('savePw').addEventListener('click', () => {
      const a = document.getElementById('s_pw').value, b = document.getElementById('s_pw2').value;
      if (!a || a.length < 3) { toast('Parola en az 3 karakter olmalı', true); return; }
      if (a !== b) { toast('Parolalar eşleşmiyor', true); return; }
      const u = db.staff.find(x => x.id === me.id); if (u) u.password = a;
      me.password = a; save(); toast('Parola değiştirildi');
      document.getElementById('s_pw').value = ''; document.getElementById('s_pw2').value = '';
    });
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lumas-butik-yedek.json'; a.click(); URL.revokeObjectURL(a.href);
      toast('Yedek indirildi');
    });
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => {
      confirmModal('Tüm ürün, sipariş, kategori ve kullanıcılar silinip başlangıç verilerine dönülecek. Emin misin?', () => {
        localStorage.removeItem(DB_KEY); db = load();
        sessionStorage.removeItem(SESSION_KEY); me = null;
        appView.classList.add('hidden'); loginView.classList.remove('hidden');
        toast('Veriler sıfırlandı'); luUser.focus();
      });
    });
  };

  /* ---------------- Genel Modal ---------------- */
  function openModal(title, bodyHTML, onSave, saveLabel) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal"><h3>${esc(title)}</h3><div class="modal-body">${bodyHTML}</div>
        <div class="modal-actions">
          <button class="btn ghost" data-cancel>${onSave ? 'İptal' : (saveLabel || 'Kapat')}</button>
          ${onSave ? `<button class="btn" data-save>Kaydet</button>` : ''}
        </div>
      </div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.querySelector('[data-cancel]').addEventListener('click', close);
    back.addEventListener('click', e => { if (e.target === back) close(); });
    const sv = back.querySelector('[data-save]');
    if (sv) sv.addEventListener('click', () => { if (onSave() !== false) close(); });
  }
  function confirmModal(msg, onYes) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal" style="max-width:420px"><h3>Onay</h3>
        <p style="color:var(--muted);line-height:1.5">${esc(msg)}</p>
        <div class="modal-actions"><button class="btn ghost" data-no>Vazgeç</button><button class="btn danger" data-yes>Evet, devam et</button></div>
      </div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.querySelector('[data-no]').addEventListener('click', close);
    back.addEventListener('click', e => { if (e.target === back) close(); });
    back.querySelector('[data-yes]').addEventListener('click', () => { onYes(); close(); });
  }

  /* ---------------- Başlat ---------------- */
  const savedSession = sessionStorage.getItem(SESSION_KEY);
  if (savedSession) {
    const found = (db.staff || []).find(s => s.id === savedSession);
    if (found) { me = found; showApp(); } else luUser.focus();
  } else luUser.focus();
})();
</script>
</body>
</html>
