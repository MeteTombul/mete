<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minik Hedef Oyunu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 12px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .hud span { color: #38bdf8; }
  .hud .miss span { color: #f87171; }
  #arena {
    position: relative;
    width: min(92vw, 520px);
    height: min(64vh, 520px);
    background: rgba(15, 23, 42, 0.6);
    border: 2px solid #334155;
    border-radius: 16px;
    overflow: hidden;
    cursor: crosshair;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .target {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fca5a5, #ef4444 55%, #b91c1c);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 8px rgba(0,0,0,0.3);
    cursor: pointer;
    will-change: transform;
  }
  .target.gold {
    background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 55%, #b45309);
    box-shadow: 0 0 24px rgba(245, 158, 11, 0.8), inset 0 0 8px rgba(0,0,0,0.3);
  }
  /* Halka nişan efekti */
  .target::after {
    content: '';
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.15) inset;
  }
  .burst {
    position: absolute;
    top: 0; left: 0;
    border-radius: 50%;
    border: 3px solid #fff;
    pointer-events: none;
    animation: burst 0.4s ease-out forwards;
    z-index: 4;
  }
  @keyframes burst {
    from { transform: translate(var(--x), var(--y)) scale(0.6); opacity: 0.9; }
    to   { transform: translate(var(--x), var(--y)) scale(2.2); opacity: 0; }
  }
  .spark {
    position: absolute;
    top: 0; left: 0;
    width: 7px; height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    animation: spark 0.5s ease-out forwards;
  }
  @keyframes spark {
    to { opacity: 0; }
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay h2 { font-size: 1.5rem; }
  .overlay p { color: #94a3b8; max-width: 320px; line-height: 1.5; }
  button {
    padding: 12px 28px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #0f172a;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(56, 189, 248, 0.5); }
  button:active { transform: translateY(0); }
  .hidden { display: none !important; }
  .float {
    position: absolute;
    top: 0; left: 0;
    font-weight: 800;
    font-size: 1.1rem;
    pointer-events: none;
    animation: rise 0.7s ease-out forwards;
    z-index: 5;
  }
  @keyframes rise {
    to { transform: translate(var(--x), calc(var(--y) - 40px)); opacity: 0; }
  }
  .hint { margin-top: 12px; color: #64748b; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>🎯 Minik Hedef Oyunu</h1>
  <div class="hud">
    <div>Skor: <span id="score">0</span></div>
    <div>Süre: <span id="time">30</span>s</div>
    <div class="miss">Kaçan: <span id="miss">0</span></div>
    <div>Rekor: <span id="best">0</span></div>
  </div>

  <div id="arena">
    <div class="overlay" id="startScreen">
      <h2>Hazır mısın?</h2>
      <p>Uçuşan hedefleri yakala! Kırmızı = 1 puan, altın hedef = 3 puan. Küçük ve hızlı olanlar daha çok puan getirir.</p>
      <button id="startBtn">Başla ▶</button>
    </div>
    <div class="overlay hidden" id="endScreen">
      <h2 id="endTitle">Süre doldu!</h2>
      <p id="endText"></p>
      <button id="restartBtn">Tekrar Oyna ↺</button>
    </div>
  </div>
  <div class="hint">İpucu: Hedefler hızlandıkça puanları artar 😉</div>

<script>
(function () {
  const arena = document.getElementById('arena');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const missEl = document.getElementById('miss');
  const bestEl = document.getElementById('best');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const endTitle = document.getElementById('endTitle');
  const endText = document.getElementById('endText');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const GAME_TIME = 30;
  let score = 0, miss = 0, timeLeft = GAME_TIME;
  let running = false;
  let countdownTimer = null;
  let targets = [];
  let rafId = null;
  let lastTs = 0;
  let spawnAccum = 0;
  let elapsed = 0;

  let best = Number(localStorage.getItem('hedefRekor') || 0);
  bestEl.textContent = best;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function floatText(x, y, text, color) {
    const f = document.createElement('div');
    f.className = 'float';
    f.textContent = text;
    f.style.color = color;
    f.style.setProperty('--x', (x - 10) + 'px');
    f.style.setProperty('--y', y + 'px');
    f.style.transform = `translate(${x - 10}px, ${y}px)`;
    arena.appendChild(f);
    setTimeout(() => f.remove(), 700);
  }

  function hitEffect(cx, cy, size, gold) {
    // Genişleyen halka
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.borderColor = gold ? '#fbbf24' : '#fca5a5';
    b.style.setProperty('--x', (cx - size / 2) + 'px');
    b.style.setProperty('--y', (cy - size / 2) + 'px');
    arena.appendChild(b);
    setTimeout(() => b.remove(), 400);

    // Kıvılcımlar
    const colors = gold ? ['#fde68a', '#f59e0b', '#fff'] : ['#fecaca', '#ef4444', '#fff'];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.background = colors[i % colors.length];
      const ang = (Math.PI * 2 * i) / 8 + rand(-0.3, 0.3);
      const dist = rand(24, 46);
      const tx = cx + Math.cos(ang) * dist;
      const ty = cy + Math.sin(ang) * dist;
      s.style.transform = `translate(${cx}px, ${cy}px)`;
      s.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(1)`, opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], { duration: 500, easing: 'ease-out' });
      arena.appendChild(s);
      setTimeout(() => s.remove(), 500);
    }
  }

  function makeTarget() {
    const isGold = Math.random() < 0.2;
    const size = rand(30, 62);
    const W = arena.clientWidth, H = arena.clientHeight;

    // Zamanla artan hız
    const speedBoost = 1 + elapsed / 30; // 1x -> 2x
    const speed = rand(45, 110) * speedBoost;
    const ang = rand(0, Math.PI * 2);

    const el = document.createElement('div');
    el.className = 'target' + (isGold ? ' gold' : '');
    el.style.width = size + 'px';
    el.style.height = size + 'px';

    const sizeBonus = Math.round((62 - size) / 20);
    const speedBonus = speed > 130 ? 1 : 0;
    const points = (isGold ? 3 : 1) + sizeBonus + speedBonus;

    const t = {
      el, size, isGold, points,
      x: rand(0, W - size),
      y: rand(0, H - size),
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      life: rand(3.2, 5),      // saniye
      age: 0,
      born: 0,                 // beliriş animasyonu ilerlemesi (0..1)
      wob: rand(0, Math.PI * 2),
      dead: false
    };

    el.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (!running || t.dead) return;
      t.dead = true;
      score += points;
      scoreEl.textContent = score;
      const cx = t.x + size / 2, cy = t.y + size / 2;
      floatText(cx, cy, '+' + points, isGold ? '#fbbf24' : '#4ade80');
      hitEffect(cx, cy, size, isGold);
      el.remove();
    });

    arena.appendChild(el);
    targets.push(t);
  }

  function step(ts) {
    if (!running) return;
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05; // sekme geçişlerinde sıçramayı önle
    elapsed += dt;

    const W = arena.clientWidth, H = arena.clientHeight;

    // Hedef üretimi (zamanla sıklaşır)
    spawnAccum += dt;
    const interval = Math.max(0.35, 0.9 - elapsed / 45);
    const maxTargets = 5;
    if (spawnAccum >= interval && targets.filter(t => !t.dead).length < maxTargets) {
      spawnAccum = 0;
      makeTarget();
    }

    for (const t of targets) {
      if (t.dead) continue;
      t.age += dt;

      // Beliriş (pop) animasyonu
      if (t.born < 1) t.born = Math.min(1, t.born + dt * 6);

      // Süresi dolanlar kaçmış sayılır
      if (t.age >= t.life) {
        t.dead = true;
        miss++;
        missEl.textContent = miss;
        t.el.animate(
          [{ opacity: 1 }, { opacity: 0, transform: t.el.style.transform + ' scale(0.4)' }],
          { duration: 200, easing: 'ease-in' }
        );
        const el = t.el;
        setTimeout(() => el.remove(), 200);
        continue;
      }

      // Hareket
      t.x += t.vx * dt;
      t.y += t.vy * dt;

      // Duvarlardan sekme
      if (t.x <= 0) { t.x = 0; t.vx = Math.abs(t.vx); }
      else if (t.x >= W - t.size) { t.x = W - t.size; t.vx = -Math.abs(t.vx); }
      if (t.y <= 0) { t.y = 0; t.vy = Math.abs(t.vy); }
      else if (t.y >= H - t.size) { t.y = H - t.size; t.vy = -Math.abs(t.vy); }

      // Hafif nabız + beliriş ölçeği
      t.wob += dt * 4;
      const pulse = 1 + Math.sin(t.wob) * 0.05;
      // Son yarım saniyede yanıp sönme uyarısı
      let fade = 1;
      const left = t.life - t.age;
      if (left < 0.8) fade = 0.4 + 0.6 * Math.abs(Math.sin(t.age * 12));
      const ease = t.born < 1 ? (t.born * (2 - t.born)) : 1; // easeOutQuad
      const scale = ease * pulse;

      t.el.style.opacity = fade;
      t.el.style.transform = `translate(${t.x}px, ${t.y}px) scale(${scale})`;
    }

    // Ölü hedefleri listeden temizle
    if (targets.length > 40) targets = targets.filter(t => !t.dead);

    rafId = requestAnimationFrame(step);
  }

  // Boş alana tıklama = ıska
  arena.addEventListener('pointerdown', function (e) {
    if (!running) return;
    const r = arena.getBoundingClientRect();
    floatText(e.clientX - r.left, e.clientY - r.top, 'Iska!', '#f87171');
  });

  function tick() {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }

  function clearAll() {
    targets.forEach(t => t.el.remove());
    targets = [];
  }

  function startGame() {
    clearAll();
    score = 0; miss = 0; timeLeft = GAME_TIME; running = true;
    elapsed = 0; spawnAccum = 0; lastTs = 0;
    scoreEl.textContent = '0';
    missEl.textContent = '0';
    timeEl.textContent = GAME_TIME;
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    countdownTimer = setInterval(tick, 1000);
    rafId = requestAnimationFrame(step);
  }

  function endGame() {
    running = false;
    clearInterval(countdownTimer);
    if (rafId) cancelAnimationFrame(rafId);
    clearAll();

    let newRecord = false;
    if (score > best) {
      best = score;
      localStorage.setItem('hedefRekor', String(best));
      bestEl.textContent = best;
      newRecord = true;
    }

    endTitle.textContent = newRecord ? '🏆 Yeni Rekor!' : 'Süre doldu!';
    endText.textContent = `Skor: ${score} · Kaçan hedef: ${miss}` +
      (newRecord ? ' — Harikasın!' : ` · Rekor: ${best}`);
    endScreen.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
